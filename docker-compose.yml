name: pitch-in
services:
  pitch-in-mysql-service:
    platform: linux/amd64
    container_name: pitch-in-mysql-service
    image: mysql
    restart: always
    ports:
      - "33006:3306"
    volumes:
      - ./templates:/app/templates
      - pitch-in-mysql-data:/var/lib/mysql
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      start_period: 20s
      timeout: 5s
      retries: 5
  pitch-in-minio:
    image: minio/minio
    container_name: pitch-in-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - ./minio_data:/data
      - ./minio.license:/minio.license
    command: server /data --console-address ":9001"

  pitch-in-api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pitch-in-api-service
    depends_on:
      pitch-in-mysql-service:
        condition: service_healthy
      pitch-in-minio:
        condition: service_started
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: on-failure

volumes:
  pitch-in-mysql-data:
